services:
  vjepa-stress:
    build:
      context: .
      dockerfile: Dockerfile
    image: vjepa-stress:latest
    container_name: vjepa-stress
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./checkpoints:/workspace/checkpoints
      - hf-cache:/workspace/.cache/huggingface
      # V-JEPA weights land here via torch.hub; persist across runs so we
      # don't re-download ~1.5 GB on every `up`.
      - torch-cache:/workspace/.cache/torch
    environment:
      - PYTHONPATH=/workspace
      - HF_HOME=/workspace/.cache/huggingface
      - TORCH_HOME=/workspace/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: bash

volumes:
  hf-cache:
  torch-cache:
